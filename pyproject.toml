[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modelrouter"
version = "1.0.0"
description = "A production-grade, multi-provider LLM gateway: two-layer routing, guardrails, caching, compression, healing, billing, and multi-tenant workspaces."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mohammad Ariz Aftab" }]
dependencies = []                 # zero required deps — the core runs fully offline

[project.optional-dependencies]
# Real provider backends are opt-in; the fake adapter needs none of these.
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
ollama = ["ollama>=0.3"]
dotenv = ["python-dotenv>=1.0"]    # config.py's .env file loading; real env vars work without it
server = ["fastapi>=0.134,<0.142", "uvicorn[standard]>=0.30,<0.41", "python-multipart>=0.0.9,<0.1"]
contracts = ["jsonschema>=4.0"]    # L7 -- real JSON Schema enforcement, not just syntax repair
redis = ["redis>=6.0"]             # shared-across-replicas EventStore tier + reservation ledger. >=6.0 specifically: store/redis_client.py uses ExponentialWithJitterBackoff for retry backoff
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.1"]   # durable, shared-across-replicas EventStore tier (store/postgres_events.py)
kafka = ["aiokafka>=0.11"]         # async trace/eval/evidence publisher (observability/async_publish.py)
aws = ["boto3>=1.34"]              # SQS publisher + KMS-sealed BYOK vault (observability/async_publish.py, tenancy/byok.py)
crypto = ["cryptography>=42.0"]    # BYOK credential vault envelope encryption (tenancy/byok.py)
sso = ["authlib>=1.7", "joserfc>=1.0", "httpx>=0.27"]   # OIDC relying party (identity/sso/) -- joserfc, not authlib.jose, which upstream deprecated
synthetic-rctgan = ["torch>=2.0", "ctgan>=0.10"]        # OPTIONAL engine for synthetic/. Large download; the default statistical engine needs nothing
all = [
    "openai>=1.0", "anthropic>=0.39", "ollama>=0.3", "python-dotenv>=1.0",
    "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9",
    "jsonschema>=4.0", "redis>=6.0", "psycopg[binary]>=3.1", "psycopg-pool>=3.1",
    "aiokafka>=0.11", "boto3>=1.34", "cryptography>=42.0",
]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]

[project.scripts]
modelrouter = "modelrouter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src/ layout: put src on sys.path so `import modelrouter` resolves without an
# editable install, and keep tests discoverable from the project root.
pythonpath = ["src"]
testpaths = ["tests"]
